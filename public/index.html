<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Xero Evidence Assistant</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f6f8fb}*{box-sizing:border-box}body{max-width:1100px;margin:36px auto;padding:0 20px}h1{margin:0 0 6px;font-size:2rem}h2{font-size:1.15rem;margin-top:0}.muted,small{color:#64748b}.toolbar,.ask-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #dfe6ee;border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(15,23,42,.03)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{padding:9px 13px;border:0;border-radius:7px;background:#0f172a;color:white;cursor:pointer;font-weight:600}button.secondary{background:#475569}button:disabled{opacity:.55;cursor:not-allowed}input{flex:1;min-width:260px;padding:10px 11px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}.source-item{padding:10px 0;border-bottom:1px solid #eef2f6}.source-item:last-child{border-bottom:0}.claim{padding:12px 0;border-top:1px solid #eef2f6}.claim:first-of-type{border-top:0}.citations{font-size:.9rem;margin-top:6px}.evidence{white-space:pre-wrap;font-size:.9rem;max-height:220px;overflow:auto;background:#f1f5f9;padding:10px;border-radius:7px;margin:7px 0}.ok{color:#166534}.partial{color:#9a6700}.bad{color:#b42318}.notice{padding:10px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;margin-top:10px}.error{background:#fff1f0;border-color:#ffccc7}.events{white-space:pre-wrap;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:330px;overflow:auto}.tag{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef2ff;font-size:.78rem;margin-left:6px}a{color:#175cd3;word-break:break-word}details{margin:7px 0}summary{cursor:pointer}@media(max-width:820px){.grid{grid-template-columns:1fr}.ask-row{align-items:stretch}.ask-row input{width:100%}}
  </style>
</head>
<body>
  <h1>Xero Evidence Assistant</h1>
  <div class="muted">Public Xero research is fetched once, stored locally, retrieved per question, and refreshed only when requested.</div>

  <section class="card">
    <div class="toolbar">
      <button id="gather-btn" onclick="gather(false)">Gather / Reuse Research</button>
      <button id="refresh-btn" class="secondary" onclick="gather(true)">Refresh Research</button>
      <span id="op" class="muted"></span>
    </div>
  </section>

  <div class="grid">
    <section class="card"><h2>Stored research</h2><div id="sources">Loading…</div></section>
    <section class="card"><h2>Activity</h2><div id="events">Loading…</div></section>
  </div>

  <section class="card">
    <h2>Ask about Xero</h2>
    <div class="ask-row">
      <input id="q" value="What accounting capabilities does Xero provide?" maxlength="1000" />
      <button id="ask-btn" onclick="ask()">Ask</button>
    </div>
    <div id="answer"></div>
  </section>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>s?new Date(s).toLocaleString():'—';
async function api(url,opts){const r=await fetch(url,opts);let body={};try{body=await r.json()}catch{}if(!r.ok)throw new Error(body.error||body.message||r.statusText);return body}
function busy(on){for(const id of ['gather-btn','refresh-btn','ask-btn'])document.getElementById(id).disabled=on}
function sourceState(s){
  if(s.lastAttemptStatus==='failed')return `<div class="notice error"><b>Latest fetch failed.</b> Using the stored snapshot from ${esc(fmt(s.retrievedAt))}.<br><small>Attempt: ${esc(fmt(s.lastAttemptAt))}${s.lastAttemptUrl?` · ${esc(s.lastAttemptUrl)}`:''}${s.lastError?` · ${esc(s.lastError)}`:''}</small></div>`;
  return `<small>Snapshot retrieved ${esc(fmt(s.retrievedAt))} · ${s.chunks} evidence chunks</small>`;
}
async function status(){
  const s=await api('/api/status');
  const sourceBox=document.getElementById('sources');
  sourceBox.innerHTML=s.sources.length?s.sources.map(x=>`<div class="source-item"><b>${esc(x.title)}</b><span class="tag">${esc(x.id)}</span><br><a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.url)}</a><br>${sourceState(x)}<br><button class="secondary" onclick="viewSource('${esc(x.id)}')">View stored evidence</button></div>`).join(''):'No stored research yet. Run Gather / Reuse Research first.';
  const lines=s.events.slice().reverse().map(e=>`${e.at}  ${e.type}${e.sourceId?'  '+e.sourceId:''}${e.provider?'  '+e.provider:''}${e.question?'  '+e.question.slice(0,70):''}${e.selectedCount!=null?'  '+e.selectedCount+' chunks/'+e.sourceCount+' sources':''}${e.claimCount!=null?'  '+e.claimCount+' claims/'+e.unknownCount+' unknowns':''}${e.contentChanged===true?'  content changed':e.contentChanged===false?'  content unchanged':''}${e.durationMs!=null?'  '+(e.durationMs/1000).toFixed(1)+'s':''}${e.error?'  '+e.error.slice(0,100):''}`);
  document.getElementById('events').innerHTML=`<small>Runtime model: ${esc(s.model)}</small><div class="events">${esc(lines.join('\n')||'No activity yet.')}</div>`;
}
async function gather(refresh){
  busy(true);document.getElementById('op').textContent=refresh?'Refreshing sources…':'Checking stored research…';
  try{const x=await api(refresh?'/api/refresh':'/api/gather',{method:'POST'});document.getElementById('op').textContent=x.results.map(r=>r.action==='reprocessed'?`${r.sourceId}: reprocessed (${r.contentChanged?'changed':'same content'})`:`${r.sourceId}: ${r.action}`).join(' · ');await status()}
  catch(e){document.getElementById('op').textContent=e.message}
  finally{busy(false)}
}
async function viewSource(id){
  const s=await api('/api/sources/'+encodeURIComponent(id));
  document.getElementById('answer').innerHTML=`<h3>${esc(s.title)}</h3><p><a target="_blank" rel="noreferrer" href="${esc(s.url)}">${esc(s.url)}</a><br><small>Stored snapshot: ${esc(fmt(s.retrievedAt))}</small></p>${s.lastAttemptStatus==='failed'?`<div class="notice error">The latest refresh attempt failed. These chunks are from the older successful snapshot.</div>`:''}${s.chunks.map(c=>`<details id="e-${esc(c.id)}"><summary>${esc(c.id)}</summary><div class="evidence">${esc(c.text)}</div></details>`).join('')}`;
}
function renderAnswer(a){
  const label=a.status==='answered'?'Answered':a.status==='partial'?'Partially supported':'Insufficient evidence';
  const cls=a.status==='answered'?'ok':a.status==='partial'?'partial':'bad';
  const claims=(a.claims||[]).map(c=>`<div class="claim"><div>${esc(c.text)}</div><div class="citations">${c.sources.map(s=>`Supported by <a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title)}</a> · <a href="#e-${esc(s.id)}">${esc(s.id)}</a> · retrieved ${esc(fmt(s.retrievedAt))}`).join('<br>')}</div></div>`).join('');
  const unknowns=(a.unknowns||[]).length?`<div class="notice"><b>Not established by the stored evidence</b><ul>${a.unknowns.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
  const evidence=(a.evidence||[]).map(e=>`<details id="e-${esc(e.id)}"><summary>${esc(e.id)} · score ${e.score} · ${esc(e.title)}</summary><div class="evidence">${esc(e.text)}</div></details>`).join('');
  return `<h3 class="${cls}">${label}</h3>${claims||(!unknowns?'<p>No supported factual claims were returned.</p>':'')}${unknowns}<h4>Retrieved evidence</h4>${evidence||'<p class="muted">No evidence was retrieved.</p>'}<p><small>Model called: ${a.modelCalled}</small></p>`;
}
async function ask(){
  const q=document.getElementById('q').value.trim();
  const box=document.getElementById('answer');
  if(!q){box.innerHTML='<p class="bad">Enter a question first.</p>';return}
  busy(true);box.innerHTML='<p class="muted">Retrieving evidence and asking the model…</p>';
  const poll=setInterval(()=>status().catch(()=>{}),1500);
  try{const a=await api('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q})});box.innerHTML=renderAnswer(a)}
  catch(e){box.innerHTML=`<div class="notice error"><b>External workflow failed safely.</b><br>${esc(e.message)}</div>`}
  finally{clearInterval(poll);busy(false);await status()}
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
status().catch(e=>{document.getElementById('events').textContent=e.message});
</script>
</body>
</html>
